<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Available Jobs - Smart Job Portal</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f4f7fb;
        }

        header {
            background: #0d6efd;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            width: 80%;
            margin: 30px auto;
        }

        .job-card {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .job-card h2 {
            color: #0d6efd;
        }

        .job-card p {
            margin: 8px 0;
        }

        .view-btn {
            display: inline-block;
            margin-top: 10px;
            padding: 10px 15px;
            background: #0d6efd;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        .view-btn:hover {
            background: #084298;
        }

        .no-jobs {
            text-align: center;
            background: white;
            padding: 30px;
            border-radius: 10px;
        }
    </style>
</head>

<body>

<header>
    <h1>Smart Job Portal</h1>
    <p>Available Jobs</p>
</header>

<div class="container">

    <div th:if="${#lists.isEmpty(jobs)}" class="no-jobs">
        <h2>No Jobs Available</h2>
        <p>Currently there are no jobs posted.</p>
    </div>

    <div th:each="job : ${jobs}" class="job-card">

        <h2 th:text="${job.title}">Job Title</h2>

        <p>
            <strong>Company:</strong>
            <span th:text="${job.company}">Company Name</span>
        </p>

        <p>
            <strong>Location:</strong>
            <span th:text="${job.location}">Location</span>
        </p>

        <p>
            <strong>Job Type:</strong>
            <span th:text="${job.jobType}">Full Time</span>
        </p>

        <p>
            <strong>Description:</strong>
            <span th:text="${job.description}">Job Description</span>
        </p>

        <a th:href="@{/jobs/{id}(id=${job.id})}" class="view-btn">
            View Details
        </a>

    </div>

</div>

</body>
</html>
