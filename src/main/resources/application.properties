spring.application.name=smart-job-portal

# MySQL Database - Aiven Cloud
spring.datasource.url=jdbc:mysql://mysql-278d801f-smart-job-portal.g.aivencloud.com:13972/defaultdb?ssl-mode=REQUIRED
spring.datasource.username=avnadmin
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
